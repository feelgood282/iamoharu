<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>문의가 접수되었습니다 | OHARU 이수연</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#fff;--ink:#111;--soft:#5c5a63;--accent:#ece6fd;--on-accent:#3b2a85}
@media (prefers-color-scheme:dark){:root{--bg:#111;--ink:#f3f2f6;--soft:#a8a5b2;--accent:#2c2450;--on-accent:#e4dcff}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;padding:24px 16px;box-sizing:border-box;word-break:keep-all}
main{max-width:520px;text-align:center;display:grid;gap:16px}
h1{font-family:"Gowun Dodum",sans-serif;font-weight:400;font-size:clamp(28px,6vw,40px);margin:0}
p{margin:0;color:var(--soft);line-height:1.8}
a{justify-self:center;margin-top:8px;padding:12px 24px;border-radius:999px;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>문의가 접수되었습니다</h1>
  <p>남겨 주셔서 감사합니다. 내용을 확인한 뒤 적어 주신 이메일로 답장드리겠습니다.</p>
  <a href="/">홈페이지로 돌아가기</a>
</main>
</body>
</html>
